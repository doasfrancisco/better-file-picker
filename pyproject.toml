[project]
name = "betterpicker"
version = "0.1.0"
description = "Scaffold .meta-repo markers and agent file-picker settings for the better-file-picker @ picker"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
betterpicker = "betterpicker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betterpicker"]

# Single source of truth: the canonical file-suggestion.sh lives at the repo
# root. The build copies it into the package so the wheel is self-contained
# and there is no duplicate file tracked in git.
[tool.hatch.build.targets.wheel.force-include]
"file-suggestion.sh" = "betterpicker/data/file-suggestion.sh"
